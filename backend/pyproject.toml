[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charavoice"
version = "0.1.0"
description = "Local character voice service: speak (GPT-SoVITS) and listen (sherpa-onnx) for any agent."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.4.7",
    "sherpa-onnx>=1.12",
    "websockets>=12",
    "mcp>=2.0",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "pyyaml>=6",
    "pyworld>=0.3.4",  # voice tweaks: DIO pitch marks for PSOLA (MIT, WORLD is modified BSD)
    "scipy>=1.11",  # filters for the naturalness post chain (BSD)
    "pyloudnorm>=0.1.1",  # BS.1770 loudness (MIT)
]

[project.optional-dependencies]
# AudioSeal watermark (CPU torch is enough; setup.py installs it from the PyTorch CPU index)
watermark = ["torch>=2.1", "audioseal>=0.2"]

[project.scripts]
charavoice = "charavoice.cli:main"
charavoice-mcp = "charavoice.mcp_server:main"

[tool.setuptools.packages.find]
include = ["charavoice*"]
